# Template — copier vers secret.local.yaml (git-ignoré) et renseigner.
# Le script deploy/prepare-secrets.sh se charge d'appliquer le secret rendu.
apiVersion: v1
kind: Secret
metadata:
  name: agent-builder-secrets
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  NEXTAUTH_SECRET: CHANGE_ME
  KEYCLOAK_CLIENT_SECRET: CHANGE_ME
  # Exemple : postgresql://app:<password-app>@postgres:5432/agentbuilder?schema=public
  DATABASE_URL: CHANGE_ME
