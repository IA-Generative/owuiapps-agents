# Job one-shot exécuté avant chaque rollout : joue prisma migrate deploy
# contre la base `agentbuilder` du Postgres du socle.
apiVersion: batch/v1
kind: Job
metadata:
  name: agent-builder-migrate
  namespace: ${NAMESPACE}
  labels:
    app: agent-builder
    job-role: migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: agent-builder
        job-role: migrate
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: owui-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: migrate
          # Image "migrator" = stage `builder` du Dockerfile (node_modules
          # complet avec CLI prisma). L'image runner (AGENT_BUILDER_IMAGE)
          # n'a que @prisma/client, pas le CLI — elle ne peut pas exécuter
          # `prisma db push`.
          image: ${AGENT_BUILDER_MIGRATOR_IMAGE}
          imagePullPolicy: IfNotPresent
          # db push tant que prisma/migrations/ est vide (scaffold).
          # À basculer sur [migrate, deploy] avec la première migration.
          command: ["node_modules/.bin/prisma", "db", "push", "--accept-data-loss", "--skip-generate"]
          envFrom:
            - secretRef:
                name: agent-builder-secrets
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
